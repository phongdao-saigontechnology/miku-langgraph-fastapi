services:
  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "8100:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      # Only override APP_ENV, let env_file handle the rest
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  db:
    image: postgres:15
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=miku
      - POSTGRES_PASSWORD=miku
      - POSTGRES_PORT=5432
      - POSTGRES_DB=miku_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miku -d miku_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  db-data:
