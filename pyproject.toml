[project]
name = "langgraph-fastapi-template"
version = "0.2.0"
description = "LangGraph FastAPI Template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Framework
    "fastapi>=0.127.0",
    "uvicorn>=0.40.0",
    "starlette-prometheus>=0.7.0",
    # LangChain & LangGraph (v1.x)
    "langchain>=1.2.0",
    "langchain-core>=1.2.5",
    "langchain-openai>=1.1.6",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.1.2",
    "langchain-mistralai>=1.1.1",
    "transformers>=4.48.0",
    "langgraph>=1.0.5",
    "langgraph-checkpoint-postgres>=3.0.2",
    # Observability
    "langfuse>=3.11.2",
    "prometheus-client>=0.23.1",
    "structlog>=25.5.0",
    # Database
    "sqlmodel>=0.0.29",
    "psycopg2-binary>=2.9.11",
    "supabase>=2.27.0",
    # Authentication & Security
    "bcrypt>=5.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt>=2.10.1",
    # Validation & Settings
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    # Utilities
    "slowapi>=0.1.9",
    "asgiref>=3.11.0",
    "ddgs>=9.10.0", # Previously duckduckgo-search
    "tqdm>=4.67.1",
    "colorama>=0.4.6",
    "langchain-mcp-adapters>=0.2.1",
    "mcp>=1.25.0",
    "mistralai>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "flake8>=7.3.0",
    "ruff>=0.14.10",
    "djlint>=1.36.4",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]


[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.flake8]
docstring-convention = "all"
ignore = ["D107", "D212", "E501", "W503", "W605", "D203", "D100"]
exclude = "venv|migrations"
max-line-length = 119

# radon
radon-max-cc = 10

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
skip = ["migrations", "venv"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "trailing-whitespace",
    "missing-function-docstring",
    "consider-using-f-string",
    "import-error",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.master]
ignore = "migrations"

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and docstring (`D`) rules
select = ["E", "F", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "F401", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
